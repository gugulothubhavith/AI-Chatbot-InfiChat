services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: infichat_postgres
    environment:
      POSTGRES_USER: infichat_user
      POSTGRES_PASSWORD: infichat_password
      POSTGRES_DB: infichat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infichat_user -d infichat_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 2. Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: infichat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 3. ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: infichat_chroma
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  # 4. SearxNG AI Web Search Engine
  searxng:
    image: searxng/searxng:latest
    container_name: infichat_searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: always

  # 5. FastAPI Backend
  backend:
    build:
      context: ./backend
    container_name: infichat_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      searxng:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+psycopg2://infichat_user:infichat_password@postgres:5432/infichat_db
      - REDIS_URL=redis://redis:6379/0
      - RAG_BACKEND=chroma
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - SEARXNG_URL=http://searxng:8080
      - UNSTRUCTURED_URL=http://unstructured-api:8000
    healthcheck:
      # Uses python, not curl: curl is not installed in the backend image, so
      # the previous check failed every run (356 consecutive failures) and the
      # container sat "unhealthy" while serving traffic normally. That also
      # meant `depends_on: condition: service_healthy` could never pass.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  # 8. Unstructured API (Omni-Parser) — GPU optional
  unstructured-api:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    container_name: infichat_unstructured
    ports:
      - "8002:8000"
    environment:
      - UNSTRUCTURED_API_KEY=local_dummy_key
    restart: always

  # 6. Main Frontend (legacy — kept as fallback)
  frontend:
    build:
      context: ./frontend
    container_name: infichat_frontend
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: always

  # 6b. Frontend-New (TanStack/React 19 — primary UI)
  frontend-new:
    build:
      context: ./Frontend-New
    container_name: infichat_frontend_new
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

  # 7. Admin Frontend
  admin-frontend:
    build:
      context: ./admin-frontend
    container_name: infichat_admin
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  redis_data:
  chromadb_data:

