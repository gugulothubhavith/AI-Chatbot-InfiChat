server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # See security-headers.conf for why these are an include rather than a
    # single server-level block: any location that declares its own add_header
    # stops inheriting all of them, and two locations below need Cache-Control.
    include /etc/nginx/snippets/security-headers.conf;

    # Same-origin API path. With this in place the console needs no CORS grant
    # and no second hostname: config.js can leave apiUrl empty and the frontend
    # falls through to /api. `backend` resolves on the compose network.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The broadcast channel is a WebSocket; without these two headers the
        # upgrade is stripped and the socket silently fails.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Never cache the runtime config or the shell — they are how a redeploy
    # takes effect.
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Hashed filenames, so these are safe to cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
