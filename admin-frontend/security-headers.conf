# Security headers for the admin console.
#
# In its own file because nginx's `add_header` inheritance is subtractive: a
# location that declares ANY add_header of its own stops inheriting every
# add_header from the server level. `location = /index.html` and
# `location = /config.js` both set Cache-Control, and `try_files $uri $uri/
# /index.html` internally rewrites `/` into the first of them — so declaring
# these once at server level silently dropped all of them from the page every
# operator actually loads.
#
# Including this snippet in each such location is the supported way to keep
# them. Do not "simplify" it back to a single server-level block.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;

# 'unsafe-inline' in script-src is required by the pre-paint theme bootstrap in
# index.html; moving it to an external file would reintroduce the light-to-dark
# flash it exists to prevent. style-src needs it for Recharts, which sets
# element styles directly. connect-src stays permissive over https/wss because
# the API host is a deploy-time decision made in config.js, not knowable here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https: wss: ws: http://localhost:* http://127.0.0.1:*; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
